<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Check Web</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js"></script>
</head>
<body>

    <h1>📝 ตัวตรวจ Grammar และแปลภาษา</h1>
    
    <!-- กล่องสำหรับพิมพ์ข้อความ -->
    <textarea id="inputText" placeholder="พิมพ์ประโยคภาษาอังกฤษที่นี่..."></textarea><br>
    
    <!-- ปุ่มกด -->
    <button onclick="checkGrammar()">ตรวจสอบ Grammar</button>

    <!-- พื้นที่แสดงผลลัพธ์ -->
    <div id="resultArea" class="result-box" style="display: none;">
        <h3>คำแปล:</h3>
        <p id="translationResult"></p>
        
        <h3>✨ คำแนะนำไวยากรณ์:</h3>
        <div id="grammarErrorsList" class="cards-container"></div>

    </div>

    
</body>
</html>
